<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dany+</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dany.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-left">
            <img src="logo.png" alt="Logo Disney+" class="logo">
            <nav class="nav-menu">
                <a href="#" class="active"><i class="fa-solid fa-house"></i> INÍCIO</a>
                <a href="#"><i class="fa-solid fa-magnifying-glass"></i> PESQUISAR</a>
                <a href="#"><i class="fa-solid fa-plus"></i> ASSISTIR MAIS TARDE</a>
                <a href="#"><i class="fa-solid fa-film"></i> FILMES</a>
                <a href="#"><i class="fa-solid fa-tv"></i> SERIES</a>
            </nav>
        </div>
        <div class="nav-right">
            <img src="perfil.jpg" alt="Perfil" class="profile-img">
        </div>
    </header>

    <main class="container">
        <section class="banner-container">
            <div class="banner">
                <img src="fundo.jpg" alt="Banner Principal" class="banner-slide active">
                <img src="1.jpeg" alt="Banner 2" class="banner-slide">
                <img src="2.jpeg" alt="Banner 3" class="banner-slide">
                <img src="3.jpeg" alt="Banner 4" class="banner-slide">
                <img src="5.jpeg" alt="Banner 5" class="banner-slide">
            </div>
            <div class="dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </section>

        <section class="brands-container">
            <div class="brand-card">
                <img src="disney.jpg" alt="Disney">
            </div>
            <div class="brand-card">
                <img src="pixar.jpg" alt="Pixar">
            </div>
            <div class="brand-card">
                <img src="marvel.jpg" alt="Marvel">
            </div>
            <div class="brand-card">
                <img src="star.jpg" alt="Star Wars">
            </div>
            <div class="brand-card">
                <img src="national.jpg" alt="National Geographic">
            </div>
        </section>

        <section class="movies-section">
            <h2>Hit Movies</h2>
            <div class="movies-row">
               <div class="movie-card"> <a href="enrolados.html">
                    <img src="enrolados.jpeg" alt="Filme 1"></a>
                </div>
                <div class="movie-card"><a href="para.html">
                    <img src="para.jpeg" alt="Filme 2"></a>
                </div>
                <div class="movie-card"><a href="verao.html">
                    <img src="verao.jpeg" alt="Filme 3"></a>
                </div>
                <div class="movie-card"><a href="grey.html">
                    <img src="grey.jpg" alt="Filme 4"></a>
                </div>
            </div>
        </section>
    </main>

    <footer> Lucas Novaes - 2026</footer>
    <script src="dany.js"></script>
</body>
</html>
